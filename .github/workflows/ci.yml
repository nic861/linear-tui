# Continuous Integration workflow for linear-tui
# Runs on pull requests and pushes to main branch

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Track go.mod rather than a literal. go.mod says `go 1.25.0`; this said
          # "1.24", so Go downloaded the 1.25 toolchain at runtime on every job and the
          # extraction collided with setup-go's cache — which is why the Test job printed
          # six passing packages and then exited 1 with no failing test.
          go-version-file: go.mod
          cache: true

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted correctly:"
            gofmt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          # Pinned, not `latest`. With `latest` the gate is non-deterministic: a new
          # golangci-lint release adds checks, and code that passed yesterday fails
          # today with nobody having touched it. Locally reproducing this job's 25
          # findings on 2026-08-23 produced 26 — the extra one arrived purely with the
          # version. Now that Renovate auto-merges security fixes on green, a lint
          # gate that can redden on its own blocks security patches, so it has to be
          # a version someone chose. Bump it deliberately.
          version: v2.13.2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Track go.mod rather than a literal. go.mod says `go 1.25.0`; this said
          # "1.24", so Go downloaded the 1.25 toolchain at runtime on every job and the
          # extraction collided with setup-go's cache — which is why the Test job printed
          # six passing packages and then exited 1 with no failing test.
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage.out
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Track go.mod rather than a literal. go.mod says `go 1.25.0`; this said
          # "1.24", so Go downloaded the 1.25 toolchain at runtime on every job and the
          # extraction collided with setup-go's cache — which is why the Test job printed
          # six passing packages and then exited 1 with no failing test.
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -v ./cmd/linear-tui
